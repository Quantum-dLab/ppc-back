version: "3.8"

services:
  api:
    container_name: ppc-api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-6969}:3001"
    networks:
      - ppc-network

  postgres:
    image: postgres:16-alpine
    container_name: ppc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASS:-1111}
      POSTGRES_DB: ${DATABASE_NAME:-ppc_db}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ppc-network

  redis:
    image: redis:7-alpine
    container_name: ppc-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASS:-8080} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASS ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ppc-network

volumes:
  postgres_data:
  redis_data:

networks:
  ppc-network:
    driver: bridge