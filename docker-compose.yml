services:
  db:
    image: postgres:16-alpine
    container_name: ppc-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ppc_db
    ports:
      - "5433:5433"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/ppc
      NODE_ENV: production
    ports:
      - "3069:3069"
    volumes:
      - .:/app
    command: ["npm", "run", "start:prod"]

volumes:
  db_data:
